name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Quest notes are valid
        run: python3 tools/check_guide.py

      - name: Lua scripts compile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for f in reframework/autorun/*.lua reframework/autorun/arisens_ledger/*.lua; do
            luac5.4 -p "$f" && echo "ok  $f"
          done
