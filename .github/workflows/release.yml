name: Release

# Publishes a GitHub release (tag vX.Y.Z + download zip) whenever the VERSION in core.lua
# changes on main and no release exists for it yet. Release notes come from that version's
# section of CHANGELOG.md. Pushing a tag vX.Y.Z by hand works too.
on:
  push:
    branches: [main]
    paths:
      - reframework/autorun/arisens_ledger/core.lua
      - CHANGELOG.md
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^local VERSION = "\(.*\)".*/\1/p' reframework/autorun/arisens_ledger/core.lua)
          if [ -z "$VER" ]; then echo "no VERSION in core.lua"; exit 1; fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER already exists; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Check quest notes
        if: env.SKIP != '1'
        run: python3 tools/check_guide.py

      - name: Build zip
        if: env.SKIP != '1'
        run: zip -qr "ArisensLedger-${VER}.zip" reframework README.md LICENSE CREDITS.md CHANGELOG.md

      - name: Release notes from CHANGELOG
        if: env.SKIP != '1'
        run: |
          python3 - <<'PY'
          import os, re
          ver = os.environ["VER"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(ver) + r"\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "See CHANGELOG.md.")
          body += ("\n\n**Install:** download `ArisensLedger-" + ver + ".zip` below and copy its `reframework` folder into your "
                   "Dragon's Dogma 2 game folder. Needs a recent [REFramework](https://github.com/praydog/REFramework-nightly/releases) "
                   "nightly. Full steps in the [README](https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "#install).")
          open("notes.md", "w", encoding="utf-8").write(body)
          PY

      - name: Publish release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VER}" "ArisensLedger-${VER}.zip" --target "$GITHUB_SHA" --title "Arisen's Ledger ${VER}" --notes-file notes.md --latest
